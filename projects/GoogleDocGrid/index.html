<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Google Doc Grid Decoder</title>
  <style>
    * { box-sizing: border-box; }

    body {
      font-family: system-ui, sans-serif;
      max-width: 720px;
      margin: 2rem auto;
      padding: 0 1rem;
      background: #1a1a2e;
      color: #eee;
    }

    h1 {
      font-size: 1.4rem;
      margin-bottom: 0.25rem;
    }

    p { color: #aaa; font-size: 0.9rem; }

    label {
      display: block;
      margin: 1.25rem 0 0.4rem;
      font-size: 0.85rem;
      color: #ccc;
    }

    input[type="url"] {
      width: 100%;
      padding: 0.6rem 0.75rem;
      border: 1px solid #444;
      border-radius: 4px;
      background: #16213e;
      color: #eee;
      font-size: 0.85rem;
    }

    button {
      margin-top: 0.75rem;
      padding: 0.55rem 1.25rem;
      background: #e94560;
      color: #fff;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.9rem;
    }

    button:hover { background: #c73652; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }

    #status {
      margin-top: 0.75rem;
      font-size: 0.85rem;
      color: #aaa;
      min-height: 1.2em;
    }

    #status.error { color: #e94560; }

    pre {
      margin-top: 1.25rem;
      padding: 1rem;
      background: #0f0f1a;
      border: 1px solid #333;
      border-radius: 4px;
      font-family: monospace;
      font-size: 1rem;
      line-height: 1.2;
      white-space: pre;
      overflow-x: auto;
      min-height: 4rem;
    }
  </style>
</head>
<body>
  <h1>Google Doc Grid Decoder</h1>
  <p>Paste a published Google Doc URL containing x / character / y coordinates and decode the Unicode grid.</p>

  <label for="docUrl">Google Doc URL</label>
  <input
    type="url"
    id="docUrl"
    value="https://docs.google.com/document/d/e/2PACX-1vTMOmshQe8YvaRXi6gEPKKlsC6UpFJSMAk4mQjLm_u1gmHdVVTaeh7nBNFBRlui0sTZ-snGwZM4DBCT/pub"
  />

  <button id="decodeBtn">Decode</button>
  <div id="status"></div>
  <pre id="output"></pre>

  <script>
    function normalizeDocUrl(url) {
      const trimmed = url.trim();
      if (!trimmed.includes('/pub')) {
        return trimmed.replace(/\/?$/, '/pub');
      }
      return trimmed;
    }

    async function fetchGoogleDocHtml(url) {
      const docUrl = normalizeDocUrl(url);

      try {
        const response = await fetch(docUrl);
        if (response.ok) {
          return response.text();
        }
      } catch (_) {
        // Direct fetch blocked by CORS — fall through to proxy.
      }

      const proxyUrl = `https://api.allorigins.win/raw?url=${encodeURIComponent(docUrl)}`;
      const proxyResponse = await fetch(proxyUrl);
      if (!proxyResponse.ok) {
        throw new Error(`Failed to fetch document (${proxyResponse.status})`);
      }
      return proxyResponse.text();
    }

    function parseCoordinateTable(html) {
      const doc = new DOMParser().parseFromString(html, 'text/html');
      const tables = doc.querySelectorAll('table');

      let targetTable = null;
      for (const table of tables) {
        if (table.textContent.toLowerCase().includes('x-coordinate')) {
          targetTable = table;
          break;
        }
      }

      if (!targetTable) {
        throw new Error('Could not find coordinate table in document');
      }

      const rows = targetTable.querySelectorAll('tr');
      const points = [];

      for (const row of rows) {
        const cells = row.querySelectorAll('td');
        if (cells.length < 3) continue;

        const xText = cells[0].textContent.trim();
        const char = cells[1].textContent.trim();
        const yText = cells[2].textContent.trim();

        if (xText.toLowerCase() === 'x-coordinate' || !/^\d+$/.test(xText) || !/^\d+$/.test(yText)) {
          continue;
        }

        points.push({
          x: parseInt(xText, 10),
          y: parseInt(yText, 10),
          char,
        });
      }

      if (points.length === 0) {
        throw new Error('No coordinate data found in table');
      }

      return points;
    }

    function buildCharacterGrid(points) {
      let maxX = 0;
      let maxY = 0;

      for (const { x, y } of points) {
        if (x > maxX) maxX = x;
        if (y > maxY) maxY = y;
      }

      const grid = Array.from({ length: maxY + 1 }, () =>
        Array(maxX + 1).fill(' ')
      );

      for (const { x, y, char } of points) {
        grid[y][x] = char;
      }

      const lines = [];
      for (let y = maxY; y >= 0; y--) {
        lines.push(grid[y].join(''));
      }

      return lines.join('\n');
    }

    async function printGridFromGoogleDoc(url) {
      const html = await fetchGoogleDocHtml(url);
      const points = parseCoordinateTable(html);
      const grid = buildCharacterGrid(points);
      console.log(grid);
      return grid;
    }

    const urlInput = document.getElementById('docUrl');
    const decodeBtn = document.getElementById('decodeBtn');
    const statusEl = document.getElementById('status');
    const outputEl = document.getElementById('output');

    decodeBtn.addEventListener('click', async () => {
      const url = urlInput.value.trim();
      if (!url) {
        statusEl.textContent = 'Please enter a URL.';
        statusEl.className = 'error';
        return;
      }

      decodeBtn.disabled = true;
      statusEl.className = '';
      statusEl.textContent = 'Fetching and decoding…';
      outputEl.textContent = '';

      try {
        const grid = await printGridFromGoogleDoc(url);
        outputEl.textContent = grid;
        statusEl.textContent = 'Done — also logged to console.';
      } catch (err) {
        statusEl.textContent = err.message || 'An error occurred.';
        statusEl.className = 'error';
      } finally {
        decodeBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
