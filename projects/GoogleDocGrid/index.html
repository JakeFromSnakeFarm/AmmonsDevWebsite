<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Google Doc Grid Decoder</title>
  <style>
    * { box-sizing: border-box; }

    body {
      font-family: system-ui, sans-serif;
      max-width: 720px;
      margin: 2rem auto;
      padding: 0 1rem;
      background: #1a1a2e;
      color: #eee;
    }

    h1 {
      font-size: 1.4rem;
      margin-bottom: 0.25rem;
    }

    p { color: #aaa; font-size: 0.9rem; }

    label {
      display: block;
      margin: 1.25rem 0 0.4rem;
      font-size: 0.85rem;
      color: #ccc;
    }

    input[type="url"] {
      width: 100%;
      padding: 0.6rem 0.75rem;
      border: 1px solid #444;
      border-radius: 4px;
      background: #16213e;
      color: #eee;
      font-size: 0.85rem;
    }

    button {
      margin-top: 0.75rem;
      padding: 0.55rem 1.25rem;
      background: #e94560;
      color: #fff;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.9rem;
    }

    button:hover { background: #c73652; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }

    #status {
      margin-top: 0.75rem;
      font-size: 0.85rem;
      color: #aaa;
      min-height: 1.2em;
    }

    #status.error { color: #e94560; }

    pre {
      margin-top: 1.25rem;
      padding: 1rem;
      background: #0f0f1a;
      border: 1px solid #333;
      border-radius: 4px;
      font-family: monospace;
      font-size: 1rem;
      line-height: 1.2;
      white-space: pre;
      overflow-x: auto;
      min-height: 4rem;
    }
  </style>
</head>
<body>
  <h1>Google Doc Grid Decoder</h1>
  <p>Paste a published Google Doc URL containing x / character / y coordinates and decode the Unicode grid.</p>

  <label for="docUrl">Google Doc URL</label>
  <input
    type="url"
    id="docUrl"
    value="https://docs.google.com/document/d/e/2PACX-1vTMOmshQe8YvaRXi6gEPKKlsC6UpFJSMAk4mQjLm_u1gmHdVVTaeh7nBNFBRlui0sTZ-snGwZM4DBCT/pub"
  />

  <button id="decodeBtn">Decode</button>
  <div id="status"></div>
  <pre id="output"></pre>

  <script type="module">
    import { printGridFromGoogleDoc } from './grid.js';

    const urlInput = document.getElementById('docUrl');
    const decodeBtn = document.getElementById('decodeBtn');
    const statusEl = document.getElementById('status');
    const outputEl = document.getElementById('output');

    async function decode() {
      const url = urlInput.value.trim();
      if (!url) {
        statusEl.textContent = 'Please enter a URL.';
        statusEl.className = 'error';
        return;
      }

      decodeBtn.disabled = true;
      statusEl.className = '';
      statusEl.textContent = 'Fetching and decoding…';
      outputEl.textContent = '';

      try {
        const grid = await printGridFromGoogleDoc(url);
        outputEl.textContent = grid;
        statusEl.textContent = 'Done — also logged to console.';
      } catch (err) {
        statusEl.textContent = err.message || 'An error occurred.';
        statusEl.className = 'error';
      } finally {
        decodeBtn.disabled = false;
      }
    }

    decodeBtn.addEventListener('click', decode);
  </script>
</body>
</html>
